name: Esteira de PR

on:
  pull_request:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior, que ficou desatualizada.
concurrency:
  group: esteira-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint e Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes Jest
        run: npm test

  analise:
    name: Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # O PMD, que analisa o Apex, roda em Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Salesforce CLI e Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer

      - name: Analisar código
        run: sf code-analyzer run --target force-app --severity-threshold 2 --output-file code-analyzer.html

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-code-analyzer
          path: code-analyzer.html

  validacao:
    name: Validar no QA
    needs: [qualidade, analise]
    runs-on: ubuntu-latest
    environment: qa
    steps:
      # O SGD compara commits: precisa do histórico inteiro, não só do último commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Instalar Salesforce CLI e sfdx-git-delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta

      - name: Calcular o que o PR muda
        id: delta
        run: |
          mkdir delta
          sf sgd source delta --from "origin/${{ github.base_ref }}" --to HEAD --output-dir delta
          echo "--- package.xml"; cat delta/package/package.xml
          echo "--- destructiveChanges.xml"; cat delta/destructiveChanges/destructiveChanges.xml
          if grep -q "<types>" delta/package/package.xml delta/destructiveChanges/destructiveChanges.xml; then
            echo "tem_mudanca=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem_mudanca=false" >> "$GITHUB_OUTPUT"
            echo "::notice::O PR não muda nenhum metadado Salesforce. Nada para validar no QA."
          fi

      - name: Login no QA (JWT)
        if: steps.delta.outputs.tem_mudanca == 'true'
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ vars.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: |
          echo "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias qa
          rm "$RUNNER_TEMP/server.key"

      - name: Validar só o que mudou, rodando os testes Apex
        if: steps.delta.outputs.tem_mudanca == 'true'
        run: |
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
            --target-org qa \
            --test-level RunLocalTests \
            --wait 30
